spring:
  datasource:
    url: jdbc:h2:mem:banking;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: test-only-jwt-secret-key-32bytes-min
  security:
    bcrypt-strength: 4
    max-failed-attempts: 5
    lock-minutes: 15
