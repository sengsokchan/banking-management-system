# Optional no-Docker profile. Data lives in memory and resets when the process stops.
# The portfolio database is MySQL, started with Docker Compose.
spring:
  datasource:
    url: jdbc:h2:mem:banking;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
