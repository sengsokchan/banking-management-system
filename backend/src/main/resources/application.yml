server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: banking-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking_dev_only}
    hikari:
      connection-timeout: 20000
      initialization-fail-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_uuid_jdbc_type: CHAR
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-meridian-trust-jwt-secret-change-me}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe-Admin-1}
    manager-password: ${SEED_MANAGER_PASSWORD:ChangeMe-Manager-1}
    teller-password: ${SEED_TELLER_PASSWORD:ChangeMe-Teller-1}
    auditor-password: ${SEED_AUDITOR_PASSWORD:ChangeMe-Auditor-1}
  security:
    bcrypt-strength: 12
    max-failed-attempts: 5
    lock-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.portfolio.banking: INFO
