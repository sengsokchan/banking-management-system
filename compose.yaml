name: meridian-banking

services:
  db:
    image: mysql:8.4.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-banking}
      MYSQL_USER: ${DB_USERNAME:-banking}
      MYSQL_PASSWORD: ${DB_PASSWORD:-banking_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-banking_root_dev_only}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-banking}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-banking}
      DB_PASSWORD: ${DB_PASSWORD:-banking_dev_only}
      JWT_SECRET: ${JWT_SECRET:-dev-only-meridian-trust-jwt-secret-change-me}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Admin-1}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-ChangeMe-Manager-1}
      SEED_TELLER_PASSWORD: ${SEED_TELLER_PASSWORD:-ChangeMe-Teller-1}
      SEED_AUDITOR_PASSWORD: ${SEED_AUDITOR_PASSWORD:-ChangeMe-Auditor-1}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  api-health:
    image: curlimages/curl:8.11.1
    network_mode: "service:api"
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 32M

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api-health:
        condition: service_healthy

volumes:
  db-data:
